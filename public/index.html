function topicHTML(t) {
  const decks = decksOfTopic(t.id), qs = decks.map(buildQueue);
  const due = qs.reduce((a, q) => a + q.nRev + q.nLearn, 0), fresh = qs.reduce((a, q) => a + q.nNew, 0);
  const cards = decks.reduce((a, d) => a + (d.cardCount || 0), 0), nothing = !due && !fresh;
  const editing = state.topicEdit?.id === t.id;
  return `
  <div class="topic ${t.archived ? "is-archived" : ""}" style="--fc:${topicColor(t)}">
    <div class="topic-head">
      <div class="deck-main">
        <h3 class="topic-name">${esc(t.name)}${t.archived ? ` <span class="archived-tag">${T("im Archiv")}</span>` : ""}</h3>
        <p class="counts">${countsLine(due, fresh, decks.length, cards)}</p>
        ${masteryBar(progressOf(decks))}
      </div>
      <div class="deck-actions">
        ${(() => {
          const off = nothing ? extraOffer(decks) : null;
          return off?.ok ? `<button class="btn ghost" data-act="study-topic" data-extra="1" data-id="${t.id}" title="${T("Die heutigen neuen Karten sitzen schon gut")}">${T("{n} weitere neue", { n: off.n })}</button>`
            : `<button class="btn ${nothing ? "ghost" : "primary"}" data-act="study-topic" data-id="${t.id}" ${nothing ? "disabled" : ""}>${nothing ? T("Für heute fertig") : t.archived ? T("Auffrischen") : T("Thema lernen")}</button>`;
        })()}
        <button class="btn ghost" data-act="topic-tree" data-id="${t.id}" aria-pressed="${state.treeOpen === t.id}">${T("Themenbaum")}</button>
        <button class="btn ghost" data-act="topic-edit" data-id="${t.id}" aria-pressed="${editing}">${T("Bearbeiten")}</button>
        <button class="btn ghost" data-act="topic-archive" data-id="${t.id}">${t.archived ? T("Zurückholen") : T("Archivieren")}</button>
      </div>
    </div>
    ${editing ? topicEditHTML() : ""}
    ${state.treeOpen === t.id && !editing ? treeHTML(t) : ""}
    ${decks.length ? `<ul class="decks">${decks.map(deckHTML).join("")}</ul>` : `<p class="muted small">${T("Noch keine Kartensets. Ordne sie unter „Bearbeiten“ zu.")}</p>`}
  </div>`;
}

function treeHTML(t) {
  const tt = topicTree(t);
  if (!tt.root) return `<div class="panel tree-panel"><p>${T("Noch kein Themenbaum. Baue unter <b>„Bearbeiten“</b> eine Gliederung des Themas auf oder füge sie als Text ein, z. B. aus deinen Vorlesungsnotizen. Die Karten werden dann automatisch den Zweigen zugeordnet.")}</p></div>`;
  const stats = treeStats(tt), leaves = treeLeaves(tt.root), open = state.treeExpanded;
  // The weakest branch: lowest progress among branches with at least 2 cards.
  const weak = leaves.filter(l => stats.get(l.id).cards >= 2).sort((a, b) => stats.get(a.id).pct - stats.get(b.id).pct)[0];
  const rest = tt.entries.filter(e => !tt.assign.has(e.c.i));
  const unsureList = tt.entries.filter(e => tt.assign.get(e.c.i)?.unsure);
  const manual = [...tt.assign.values()].filter(a => a.manual).length + Object.values(t.pins || {}).filter(v => v === "none").length;
  // All branches for the "move to" menu, indented by level.
  const nodes = []; const walk = n => { if (n !== tt.root) nodes.push(n); n.children.forEach(walk); }; walk(tt.root);
  const label = id => nodes.find(n => n.id === id)?.label || "";
  const short = l => l.length > 48 ? l.slice(0, 46) + "…" : l;
  const pinOf = c => t.pins?.[c.i];
  const cardRow = ({ c }) => {
    const a = tt.assign.get(c.i), pin = pinOf(c);
    const opts = [`<option value="auto" ${!pin ? "selected" : ""}>${T("Automatisch")}${a && !a.manual ? ` (${esc(short(label(a.node)))})` : ""}</option>`]
      .concat(nodes.map(n => `<option value="${n.id}" ${pin === n.id ? "selected" : ""}>${"  ".repeat(n.depth - 1)}${esc(short(n.label))}</option>`))
      .concat(`<option value="none" ${pin === "none" ? "selected" : ""}>${T("Keinem Zweig zuordnen")}</option>`);
    return `<li class="cardrow">
      <span class="cr-text" title="${esc(plain(c.f))}">${esc(plain(c.f).slice(0, 130))}</span>
      ${a?.manual || pin === "none" ? `<span class="cr-tag">${T("von Hand")}</span>` : a?.unsure ? `<span class="cr-tag unsure">${T("unsicher")}</span>` : ""}
      <select class="reassign" data-tid="${t.id}" data-cid="${c.i}" aria-label="${T("Zweig dieser Karte")}">${opts.join("")}</select>
    </li>`;
  };
  const byNode = new Map();
  for (const e of tt.entries) { const a = tt.assign.get(e.c.i); if (a) (byNode.get(a.node) || byNode.set(a.node, []).get(a.node)).push(e); }
  const nodeHTML = n => {
    const st = stats.get(n.id), isWeak = weak && n === weak && st.pct < 60, own = byNode.get(n.id) || [], isOpen = open.has(n.id);
    return `<li><div class="node ${isWeak ? "weak" : ""}">
      <span class="node-label">${esc(n.label)}</span>
      <span class="node-meta">${st.cards ? `${Tn(st.cards, "{n} Karte", "{n} Karten")}${st.due ? ` · <span class="c-rev">${T("{n} fällig", { n: st.due })}</span>` : ""} · ${pctN(st.pct)}` : T("noch keine Karten")}${isWeak ? " · " + T("schwächster Zweig") : ""}</span>
      ${st.units ? `<div class="segbar" aria-hidden="true">${st.counts.map((v, i) => v ? `<i class="f${i}" style="width:${v / st.units * 100}%"></i>` : "").join("")}</div>` : ""}
      ${own.length ? `<button class="linkish node-toggle" data-act="tree-toggle" data-k="${n.id}" aria-expanded="${isOpen}">${isOpen ? T("Karten ausblenden") : Tn(own.length, "{n} Karte anzeigen", "{n} Karten anzeigen")}</button>` : ""}
    </div>
    ${isOpen ? `<ul class="cardlist">${own.map(cardRow).join("")}</ul>` : ""}
    ${n.children.length ? `<ul>${n.children.map(nodeHTML).join("")}</ul>` : ""}</li>`;
  };
  const section = (k, title, list, intro) => list.length ? `
    <div class="tree-sec">
      <button class="linkish sec-toggle" data-act="tree-toggle" data-k="${k}" aria-expanded="${open.has(k)}">${open.has(k) ? "▾" : "▸"} ${title}</button>
      ${open.has(k) ? `${intro}<ul class="cardlist">${list.map(k === "unsure" ? unsureRow : cardRow).join("")}</ul>` : ""}
    </div>` : "";
  // Unsure cards: confirm the guess or take the runner-up with one click.
  const unsureRow = ({ c }) => {
    const a = tt.assign.get(c.i);
    return `<li class="cardrow">
      <span class="cr-text" title="${esc(plain(c.f))}">${esc(plain(c.f).slice(0, 130))}</span>
      <span class="cr-pick">
        <button class="btn ghost sm" data-act="pin" data-tid="${t.id}" data-cid="${c.i}" data-to="${a.node}">${esc(short(label(a.node)))}</button>
        ${a.alt ? `<button class="btn ghost sm" data-act="pin" data-tid="${t.id}" data-cid="${c.i}" data-to="${a.alt}">${esc(short(label(a.alt)))}</button>` : ""}
      </span>
    </li>`;
  };
  const sg = rest.length ? suggestBranches(tt, t.outline) : [];
  return `
  <div class="panel tree-panel">
    ${tt.root.label ? `<p class="tree-root">${esc(tt.root.label)}</p>` : ""}
    <ul class="tree">${tt.root.children.map(nodeHTML).join("")}</ul>
    <p class="muted small">${manual ? T("{a} von {b} Karten zugeordnet, davon {m} von Hand.", { a: tt.assign.size, b: tt.entries.length, m: manual }) : T("{a} von {b} Karten zugeordnet.", { a: tt.assign.size, b: tt.entries.length })} ${T("Die Balken zeigen die Karteikasten-Fächer, der Prozentwert den Fortschritt. Unter „Karten anzeigen“ kannst du jede Karte einem anderen Zweig zuordnen.")}</p>

          <button type="button" class="ol-btn" data-act="ol-up" data-nid="${n.id}" title="${T("Nach oben (Alt+↑)")}" aria-label="${T("Nach oben")}" ${i ? "" : "disabled"}>↑</button>
          <button type="button" class="ol-btn" data-act="ol-down" data-nid="${n.id}" title="${T("Nach unten (Alt+↓)")}" aria-label="${T("Nach unten")}" ${last ? "disabled" : ""}>↓</button>
          <button type="button" class="ol-btn" data-act="ol-child" data-nid="${n.id}" title="${T("Unterzweig hinzufügen")}" aria-label="${T("Unterzweig hinzufügen")}">+</button>
          <button type="button" class="ol-btn" data-act="ol-del" data-nid="${n.id}" title="${T("Löschen (Unterzweige rücken nach)")}" aria-label="${T("Löschen")}">✕</button>

      <textarea id="topic-tree" rows="7" spellcheck="false" placeholder="${T("Thema&#10;├── 1. Grundlagen&#10;│   └── Porter: Operative Effizienz vs. strategische Position&#10;└── 2. Innovation&#10;    └── Christensen: Disruptive Innovation")}">${esc(te.pasteText || "")}</textarea>

function masteryBar(p) {
  if (!p.units) return "";

  const stage = (n, name, hint) => `<div class="stage" title="${hint}"><div class="stage-top"><b>${n}</b><span>${name}</span></div><div class="stage-bar"><i style="width:${p.units ? n / p.units * 100 : 0}%"></i></div></div>`;
  return `<div class="mastery">
    <div class="stages">
      ${stage(p.started, T("angefangen"), T("Mindestens einmal gelernt"))}
      ${stage(p.learned, T("gelernt"), T("Kurze Lernrunden geschafft, kommt erst in ein paar Tagen wieder"))}

/* ---------- Cards: search, edit, add, delete, suspend ----------
   A card you keep forgetting ("Problemkarte") is usually badly worded, so the app points it out. */
const LEECH = 4;
const lapsesOf = c => Math.max(c.sf?.lapses || 0, c.sr?.lapses || 0);
const isLeech = c => lapsesOf(c) >= LEECH;
const fold = t => plain(t).toLowerCase().normalize("NFD").replace(/\p{M}/gu, "");
function cardFach(deck, c) { return Math.min(...dirsOf(deck).map(d => fachOf(c["s" + d]))); }
function listCards(deck) {
  const cl = state.cardList, q = fold(cl.q.trim());
  let list = (state.cards[deck.id] || []).filter(c =>
    (cl.filter === "all" || cl.filter === "leech" && isLeech(c) || cl.filter === "susp" && c.x || cl.filter === "new" && !c.sf && !c.sr)
    && (!q || fold(c.f).includes(q) || fold(c.b).includes(q)));
  if (cl.filter === "leech") list = list.slice().sort((a, b) => lapsesOf(b) - lapsesOf(a));
  return list;
}
function cardFormHTML(prefix, f, b, extra, save, saveAttrs) {
  return `
    <label class="field">${T("Vorderseite")}<textarea class="ce-input" id="${prefix}-f" rows="2">${esc(f)}</textarea></label>
    <label class="field">${T("Rückseite")}<textarea class="ce-input" id="${prefix}-b" rows="3">${esc(b)}</textarea><span class="hint">${T("Mit *Sternchen* markierst du Schlüsselbegriffe.")}</span></label>
    ${extra}
    <div class="row-actions">
      <button class="btn primary sm" data-act="${save}" ${saveAttrs}>${T("Speichern")}</button>
      <button class="btn ghost sm" data-act="${save === "st-save" ? "st-cancel" : save === "cl-add-save" ? "cl-add-cancel" : "cl-cancel"}">${T("Abbrechen")}</button>
    </div>`;
}
function cardRowsHTML(deck) {
  const cl = state.cardList, list = listCards(deck);
  if (!list.length) return `<p class="muted small">${cl.q.trim() ? T("Keine Karte gefunden.") : cl.filter === "leech" ? T("Keine Problemkarten. Als Problemkarte gilt eine Karte, die du {n}-mal oder öfter vergessen hast.", { n: LEECH }) : cl.filter === "susp" ? T("Keine Karte ausgesetzt.") : T("Keine Karten.")}</p>`;
  const row = c => {
    if (cl.edit === c.i) return `<li class="ce-row editing">${cardFormHTML("ce", c.f, c.b,
      c.sf || c.sr ? `<label class="check"><input type="checkbox" id="ce-reset"> ${T("Lernstand zurücksetzen (die Karte gilt dann wieder als neu)")}</label>` : "",
      "cl-save", `data-id="${deck.id}" data-cid="${c.i}"`)}</li>`;
    const fach = cardFach(deck, c), n = lapsesOf(c);
    return `<li class="ce-row ${c.x ? "susp" : ""}">
      <div class="ce-text"><b>${esc(plain(c.f).slice(0, 200))}</b><span>${esc(plain(c.b).slice(0, 240))}</span></div>
      <div class="ce-meta">
        ${c.x ? `<span class="cr-tag susp">${T("ausgesetzt")}</span>` : `<span class="cr-tag">${T(FAECHER[fach].name)}</span>`}
        ${n >= LEECH ? `<span class="cr-tag leech">${T("{n}× vergessen", { n })}</span>` : ""}
      </div>
      <div class="ce-acts">${cl.confirmDel === c.i

/* ---------- Several devices: merge instead of overwrite ----------
   Phone and computer share one server. A write based on an old state is refused (409);
   then both versions are merged: per card the latest review wins, answers from both are kept.
   An open tab also checks for news when it comes back into view and every 30 seconds. */
const entryKey = e => e[0] + ":" + e[1] + ":" + e[3];
const isTyping = () => { const a = document.activeElement; return !!a && !!a.matches?.("input[type=text],textarea"); };
// One direction's learning state from two devices: the later review wins. A reset (state removed
// on purpose, marked by the card's change time) wins over reviews that happened before it.
function newerState(a, b, am = 0, bm = 0) {
  if (!a && !b) return null;
  if (a && b) return b.last > a.last || (b.last === a.last && b.reps > a.reps) ? b : a;
  if (!a) return am > b.last ? null : b;
  return bm > a.last ? null : a;
}
// Returns how many directions the other device started today (they count toward today's new cards).
function mergeCardInto(local, remote) {
  const lm = local.m || 0, rm = remote.m || 0, today = dayKey();
  let started = 0;
  for (const k of ["sf", "sr"]) {
    const was = local[k];
    local[k] = newerState(was, remote[k], lm, rm);
    if (!was && local[k] && dayKey(local[k].last) === today) started++;
  }
  if (rm > lm) { local.f = remote.f; local.b = remote.b; local.x = remote.x; local.m = rm; cardsRev++; }
  return started;
}
const startedToday = c => ["sf", "sr"].filter(k => c[k] && dayKey(c[k].last) === dayKey()).length;
// Today's counters of a deck grow by what the other device did today.
function bumpToday(deck, field, n) {
  if (!n) return;
  const day = field === "newCount" ? "newDay" : "revDay", t = dayKey();
  if (deck[day] !== t) { deck[day] = t; deck[field] = 0; }
  deck[field] = (deck[field] || 0) + n;
}
// Two copies of a card (possible after cards moved between storage chunks on two devices): keep one, merged.
function dedupeCards(cards) {
  const byId = new Map(), out = [];
  for (const c of cards) { const have = byId.get(c.i); if (have) mergeCardInto(have, c); else { byId.set(c.i, c); out.push(c); } }
  return out;
}
function mergeLogEntries(a, b) {
  const m = new Map();
  for (const e of [...a, ...b]) { const k = entryKey(e); if (!SYNC.undone.has(k) && !m.has(k)) m.set(k, e); }
  return [...m.values()].sort((x, y) => x[3] - y[3]);
}
function applyChunkRows(deck, k, rows) {
  const cards = state.cards[deck.id] || (state.cards[deck.id] = []);
  const byId = new Map(cards.map(c => [c.i, c]));
  let started = 0;
  for (const r of rows || []) {
    const rc = fromRow({ ...r, _k: k }), lc = byId.get(rc.i);
    if (lc) started += mergeCardInto(lc, rc);
    else if (!SYNC.deleted.has(rc.i)) { cards.push(rc); byId.set(rc.i, rc); cardsRev++; started += startedToday(rc); }
  }
  bumpToday(deck, "newCount", started);
}
// pull: nothing of ours is waiting to be saved, so settings come from the other device.
// Today's counters: on the same day this tab's count already includes what merging brought in.
function applyMeta(deck, r, pull) {
  for (const [day, count] of [["newDay", "newCount"], ["revDay", "revCount"]]) {
    if ((r[day] || "") > (deck[day] || "")) { deck[day] = r[day]; deck[count] = r[count] || 0; }
  }
  if ((r.bonusDay || "") > (deck.bonusDay || "")) { deck.bonusDay = r.bonusDay; deck.bonus = r.bonus || 0; }
  else if (r.bonusDay && r.bonusDay === deck.bonusDay) deck.bonus = Math.max(deck.bonus || 0, r.bonus || 0);
  if (pull) {
    const n = normDeck(r);
    for (const k of ["name", "dir", "mode", "newPerDay", "retention", "topic", "created"]) deck[k] = n[k] ?? null;
    deck.chunks = r.chunks || 0;
  } else deck.chunks = Math.max(deck.chunks || 0, r.chunks || 0);
}
function applyProfile(r, pull) {
  const p = state.profile;
  for (const [d, n] of Object.entries(r.days || {})) p.days[d] = Math.max(p.days[d] || 0, n || 0);
  for (const [b, t] of Object.entries(r.badges || {})) p.badges[b] = p.badges[b] ? Math.min(p.badges[b], t) : t;
  for (const [d, v] of Object.entries(r.daily || {})) { const l = p.daily[d] || {}; p.daily[d] = { learned: Math.max(l.learned || 0, v?.learned || 0), up: Math.max(l.up || 0, v?.up || 0) }; }
  if (pull && r.goal) p.goal = r.goal;
  if (pull && r.prefs) { p.prefs = normPrefs(r.prefs); applyPrefs(); }
}
function applyLog(r) {
  if (!r || !Array.isArray(r.entries)) return;
  for (const e of r.entries) if (!SYNC.undone.has(entryKey(e))) addAttempt(e);
  if (r.day !== state.log.day) return;
  const known = new Set(state.log.entries.map(entryKey));
  state.log.entries = mergeLogEntries(state.log.entries, r.entries);
  const perDeck = {};
  for (const e of state.log.entries) if (!known.has(entryKey(e))) perDeck[e[4]] = (perDeck[e[4]] || 0) + 1;
  for (const [id, n] of Object.entries(perDeck)) { const d = deckById(id); if (d) bumpToday(d, "revCount", n); }
  state.profile.days[r.day] = Math.max(state.profile.days[r.day] || 0, state.log.entries.length);

// A refused write: merge the other device's version into this tab. "retry" writes again, "drop" gives up the write.
function resolveConflict(key, e) {
  const remote = e.remote || {}, data = remote.data;
  state.store.setRev(e.id, remote.rev ?? 0);
  const [type, a, b] = key.split(":");
  if (type === "c" || type === "m") {
    const deck = deckById(a);
    if (!deck || !data) return "drop"; // deck deleted on the other device: the next check removes it here too
    if (type === "c") applyChunkRows(deck, +b, data.cards);
    else applyMeta(deck, data, false);
    return "retry";
  }
  if (type === "p" && data) applyProfile(data, false);
  if (type === "l" && data) applyLog(data);
  return "retry"; // topics: this tab's version wins
}
// Pick up what other devices saved since this tab last looked.
async function pullChanges({ quiet = false } = {}) {
  const st = state.store;
  if (!st?.changes || SYNC.busy || state.loading || state.loadError || state.restore?.busy) return;
  SYNC.busy = true;
  try {
    await flush();
    const ch = await st.changes(SYNC.rev);
    const docs = ch.docs.filter(d => st.revOf(d.id) !== d.rev);
    const gone = ch.deleted.filter(d => st.revOf(d.id) !== d.rev);
    if (!docs.length && !gone.length) { SYNC.rev = ch.rev; return; }
    // Decks with changed cards are read completely, so moved and deleted cards come out right.
    const metas = new Map(), touched = new Set();
    for (const d of docs) { if (d.data?.kind === "deck") metas.set(d.data.id, d.data); if (d.data?.kind === "chunk") touched.add(d.data.deck); }
    for (const id of metas.keys()) touched.add(id);
    const chunks = new Map();
    for (const id of touched) {
      const meta = metas.get(id) || (deckById(id) && metaOf(deckById(id)));
      if (meta && !gone.some(g => g.id === "deck-" + id)) chunks.set(id, await st.fetchChunks(meta));
    }
    // Something of ours got queued meanwhile: leave it to the next check, after it is saved.
    if (WQ.busy || WQ.pending.size) return;
    for (const g of gone) {
      st.setRev(g.id, g.rev);
      const m = g.id.match(/^deck-(.+)$/);
      if (m && !/-c\d+$/.test(g.id)) { state.decks = state.decks.filter(d => d.id !== m[1]); delete state.cards[m[1]]; if (state.open?.id === m[1]) state.open = null; }
    }
    // Order matters for today's counters: cards and answers first (they add what the other device did), settings last.
    for (const [id, meta] of metas) if (!deckById(id) && !gone.some(g => g.id === "deck-" + id)) {
      state.decks.unshift(normDeck({ ...meta, newDay: "", newCount: 0, revDay: "", revCount: 0 })); state.cards[id] = [];
    }
    for (const [id, list] of chunks) {
      const deck = deckById(id); if (!deck) continue;
      const rows = list.flatMap(({ data }, k) => (data?.cards || []).map(r => ({ ...r, _k: k })));
      const seen = new Set(rows.map(r => r.i));
      const cards = state.cards[id] = (state.cards[id] || []).filter(c => seen.has(c.i));
      const byId = new Map(cards.map(c => [c.i, c]));
      let started = 0;
      for (const r of rows) {
        const rc = fromRow(r), lc = byId.get(rc.i);
        if (lc) { started += mergeCardInto(lc, rc); lc.c = rc.c; } else { cards.push(rc); byId.set(rc.i, rc); started += startedToday(rc); }
      }
      bumpToday(deck, "newCount", started);
      deck.cardCount = cards.length; cardsRev++;
    }
    for (const d of docs) {
      if (d.id === "profile" && d.data) applyProfile(d.data, true);
      else if (d.data?.kind === "log") applyLog(d.data);
      else if (d.id === "topics" && d.data) state.topics = normTopics(d.data.list);
      st.setRev(d.id, d.rev);
    }
    for (const [id, meta] of metas) { const deck = deckById(id); if (deck) applyMeta(deck, meta, true); }
    for (const list of chunks.values()) for (const { id, rev } of list) st.setRev(id, rev);
    SYNC.rev = ch.rev;
    if (!isTyping()) render();
    if (!quiet) toast(T("Neuer Stand von einem anderen Gerät übernommen."));
  } catch { /* server unreachable: try again at the next check */ }
  finally { SYNC.busy = false; }
}

/* ---------- Backup: download everything, restore from a file ---------- */
function daysAgo(t) {
  const n = Math.round((new Date(dayKey()) - new Date(dayKey(t))) / DAY);
  return n <= 0 ? T("heute") : n === 1 ? T("gestern") : T("vor {n} Tagen", { n });
}

        <label class="btn ghost" for="file-restore">${T("Aus Sicherung wiederherstellen")}</label>
        <input class="sr" type="file" id="file-restore" accept=".json,application/json">
        ${dl && state.decks.length ? `<span class="small ${stale ? "warn-text" : "muted"}">${dl}</span>` : ""}

}
// On the overview: a reminder once there is something worth keeping (oldest deck a week old) and no download for 30 days.
function backupNudgeHTML() {

}

async function openRestore(file) {
  if (!file) return;

  if (!b || b.app !== "karteikasten" || !Array.isArray(b.docs) || !b.docs.length) { toast(T("Die Datei ist keine Karteikasten-Sicherung.")); return; }
  const data = b.docs.map(d => d?.data || {});
  state.restore = { docs: b.docs, created: b.created || file.lastModified, decks: data.filter(d => d.kind === "deck").length,
    cards: data.filter(d => d.kind === "chunk").reduce((a, d) => a + (Array.isArray(d.cards) ? d.cards.length : 0), 0), busy: false };
  state.uiOpen = true; render();

}
async function doRestore() {
  const r = state.restore; if (!r || r.busy) return;
  r.busy = true; render();
  // Unsaved changes of this tab would land on top of the restored data, so drop them.
  clearTimeout(WQ.timer); WQ.pending.clear();
  try {
    const res = await apiFetch("/api/restore", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ app: "karteikasten", format: 1, created: r.created, docs: r.docs }) });
    const out = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(out.error || T("Wiederherstellen fehlgeschlagen."));
  } catch (e) {
    r.busy = false; render();
    toast(e.message === "Failed to fetch" ? T("Der Server antwortet nicht.") : e.message); return;
  }
  state.restore = null;
  toast(T("Sicherung wiederhergestellt. Lade neu …"));
  setTimeout(() => location.reload(), 700);
}

/* ---------- CSV export of one deck ---------- */
function exportCSV(deck) {
  const cell = v => /[";\n\r]/.test(v) || /^\s|\s$/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  const rows = [[T("Vorderseite"), T("Rückseite")], ...(state.cards[deck.id] || []).map(c => [c.f, c.b])];
  const text = "\uFEFF" + rows.map(r => r.map(cell).join(";")).join("\r\n") + "\r\n";
  const url = URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url; a.download = (deck.name.replace(/[\\/:*?"<>|]+/g, " ").replace(/\s+/g, " ").trim() || T("Stapel")) + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(T("{n} Karten als CSV exportiert. Der Lernstand ist darin nicht enthalten.", { n: (state.cards[deck.id] || []).length }));
}

function studyHTML() {
  const s = state.session;
  if (s.finished) return doneHTML(s);
  const u = s.current, deck = u.deck, st = ust(u), now = Date.now();
  const cntNew = s.main.filter(x => !ust(x)).length + (!st ? 1 : 0);
  const cntLearn = s.learn.length + (isLearning(st) ? 1 : 0);
  const cntRev = s.main.filter(x => ust(x)?.q === 2).length + (st?.q === 2 ? 1 : 0);
  const left = s.main.length + s.learn.length + 1;
  const prog = s.done / (s.done + left);
  const front = u.dir === "f" ? u.card.f : u.card.b, back = u.dir === "f" ? u.card.b : u.card.f;
  const sizeF = front.length > 220 ? "xs" : front.length > 80 ? "sm" : "";

function doneHTML(s) {
  const decks = s.deckIds.map(deckById).filter(Boolean), many = decks.length > 1;
  const mins = Math.max(1, Math.round((Date.now() - s.started) / MIN));
  const firsts = [...s.first.values()];
  const ok = firsts.length ? firsts.filter(g => g >= 2).length / firsts.length : 0;
  const eod = endOfToday();
  let tomorrow = 0;
  for (const deck of decks) for (const c of state.cards[deck.id] || []) for (const dir of dirsOf(deck)) { const st = c["s" + dir]; if (st && (isLearning(st) || st.due <= eod + DAY)) tomorrow++; }
  const qs = decks.map(buildQueue);
  const newTomorrow = decks.reduce((a, d, i) => a + (qs[i].unseen + qs[i].nNew > 0 ? (d.newPerDay ?? 20) : 0), 0);
  let up = 0, down = 0;
  for (const { u, from } of s.startFach.values()) { const to = fachOf(ust(u)); if (to > from) up++; else if (to < from) down++; }
  return `
  <div class="study">
    <div class="panel done">
      <p class="eyebrow">${esc(s.title)}</p>
      <p class="big">${T("Für heute geschafft.")}</p>
      <p>${Tn(firsts.length, "{n} Karte in {m} Min.", "{n} Karten in {m} Min.", { m: mins })} ${T("Beim ersten Versuch gewusst:")} <b>${pct(ok)}</b>.</p>
      ${up || down ? `<p>${Tn(up, "{n} Karte in ein höheres Fach gerückt", "{n} Karten in ein höheres Fach gerückt")}${down ? ", " + T("{n} zurückgefallen", { n: down }) : ""}. ${(() => { const p = progressOf(decks); return `${!many ? T("Fortschritt im Stapel:") : s.topicId ? T("Fortschritt im Thema:") : T("Fortschritt insgesamt:")} <b>${pctN(p.pct)}</b>${p.tier ? ` (${T(p.tier.name)})` : ""}.`; })()}</p>` : ""}
      ${s.badges.length && !quiet() ? `<p>${T("Neue Abzeichen:")} <b>${s.badges.map(b => esc(T(b.name))).join(", ")}</b>.</p>` : ""}
      <p>${(() => { const st = streakInfo(); return quiet() ? T("Antworten heute: {a}/{b}.", { a: st.today, b: state.profile.goal }) : st.todayOk ? `${T("Tagesziel erreicht ({a}/{b}).", { a: st.today, b: state.profile.goal })} ${T("Serie:")} <b>${Tn(st.n, "{n} Tag", "{n} Tage")}</b>.` : T("Tagesziel: {a}/{b} Antworten. Noch {c} in einem anderen Stapel, oder hol dir 10 neue Karten.", { a: st.today, b: state.profile.goal, c: state.profile.goal - st.today }); })()}</p>
      ${extraOfferHTML(extraOffer(decks), decks)}
      <p class="muted">${newTomorrow > 0 ? T("Morgen warten etwa {r} Wiederholungen und bis zu {n} neue Karten.", { r: tomorrow, n: newTomorrow }) : T("Morgen warten etwa {r} Wiederholungen.", { r: tomorrow })} ${T("Am meisten bringt es, jeden Tag kurz zu lernen.")}</p>
      <div class="row-actions">
        <button class="btn primary" data-act="exit" data-autofocus>${T("Zur Übersicht")}</button>

      </div>
    </div>
  </div>`;
}

/* Outline editing: every change works on the draft, saved with "Speichern" */
const blankNode = () => ({ id: rid(), label: "", children: [] });
function findNode(list, id, parent = null) {
  for (let i = 0; i < list.length; i++) {
    if (list[i].id === id) return { node: list[i], list, index: i, parent };
    const r = findNode(list[i].children, id, list[i]);
    if (r) return r;
  }
  return null;
}
function outlineOp(op, id) {
  const te = state.topicEdit; if (!te) return;
  const root = te.outline.children, f = id ? findNode(root, id) : null;
  let focus = id;
  if (op === "add") { const n = blankNode(); root.push(n); focus = n.id; }
  else if (!f) return;
  else if (op === "after") { const n = blankNode(); f.list.splice(f.index + 1, 0, n); focus = n.id; }
  else if (op === "child") { const n = blankNode(); f.node.children.push(n); focus = n.id; }
  else if (op === "in" && f.index > 0) { f.list.splice(f.index, 1); f.list[f.index - 1].children.push(f.node); }
  else if (op === "out" && f.parent) {
    const pf = findNode(root, f.parent.id);
    f.list.splice(f.index, 1); pf.list.splice(pf.index + 1, 0, f.node);
  }
  else if (op === "up" && f.index > 0) { [f.list[f.index - 1], f.list[f.index]] = [f.list[f.index], f.list[f.index - 1]]; }
  else if (op === "down" && f.index < f.list.length - 1) { [f.list[f.index + 1], f.list[f.index]] = [f.list[f.index], f.list[f.index + 1]]; }
  else if (op === "del") {
    // Deleting keeps the sub-branches: they move up into the gap.
    const prev = f.index > 0 ? f.list[f.index - 1] : f.parent;
    f.list.splice(f.index, 1, ...f.node.children);
    focus = f.node.children[0]?.id || prev?.id || null;
  }
  state.focusNid = focus;
  render();
}
let olTimer = 0;
// Typing only updates the counts and suggestions, so the cursor stays where it is.
function refreshOutlineInfo() {
  const te = state.topicEdit; if (!te) return;
  const tt = draftTree(te), stats = tt.root ? treeStats(tt) : new Map();
  document.querySelectorAll(".ol-count").forEach(el => { const st = stats.get(el.dataset.nid); el.textContent = st ? Tn(st.cards, "{n} Karte", "{n} Karten") : ""; });
  const sum = $("#ol-summary"); if (sum && tt.root) sum.textContent = T("{a} von {b} Karten zugeordnet", { a: tt.assign.size, b: tt.entries.length });
  const box = $("#ol-suggs"); if (box) box.innerHTML = suggestionsHTML(te);
}
const cloneOutline = o => o ? JSON.parse(JSON.stringify(o)) : { title: "", children: [] };
// Drops unnamed branches (their sub-branches move up) before saving.
function cleanOutline(o) {
  const clean = list => list.flatMap(n => n.label.trim() ? [{ id: n.id, label: n.label.trim(), children: clean(n.children) }] : clean(n.children));
  const children = clean(o.children);
  return children.length ? { title: (o.title || "").trim(), children } : null;
}

function treePreviewText(text) {
  const root = parseTree(text);
  if (!root) return "";
  const leaves = treeLeaves(root).filter(l => l !== root);
  return T("Erkannt: {a} Hauptzweige, {b} Unterthemen.", { a: root.children.length, b: leaves.length });
}

document.addEventListener("click", e => {

  const id = b.dataset.id, act = b.dataset.act;
  if (act === "ui-settings") {
    state.uiOpen = !state.uiOpen; render();

  }

  else if (act === "study-topic") startTopic(id, b.dataset.extra === "1");
  else if (act === "extra-new") addExtraNew();
  else if (act === "home") { setHome(id); state.open = null; render(); window.scrollTo({ top: 0 }); }

  else if (act === "topic-edit") { const t = topicById(id); state.topicEdit = state.topicEdit?.id === id ? null : { id, name: t.name, outline: cloneOutline(t.outline), deckIds: new Set(decksOfTopic(id).map(d => d.id)), confirmDelete: false, color: t.color ?? 0 }; render(); }
  else if (act?.startsWith("ol-") && state.topicEdit) {
    const te = state.topicEdit, nid = b.dataset.nid;
    if (act === "ol-add") outlineOp("add");
    else if (act === "ol-text") { te.textOpen = !te.textOpen; render(); $("#topic-tree")?.focus(); }
    else if (act === "ol-text-apply") {
      const o = outlineFromText(te.pasteText);
      if (!o) { toast(T("Im Text wurde keine Gliederung erkannt.")); return; }

      const n = { id: rid(), label: sg.label, children: [] };

  else if (act === "topic-del-no") { state.topicEdit.confirmDelete = false; render(); }
  else if (act === "topic-del-yes") {
    const tid = state.topicEdit.id;

  }
  else if (act === "reveal") reveal();
  else if (act === "choose") chooseOption(+b.dataset.i);
  else if (act === "dont-know") dontKnow();
  else if (act === "rate") rate(+b.dataset.g);
  else if (act === "undo") undo();
  else if (act === "exit") exitStudy();
  else if (act === "imp-go") doImport();
  else if (act === "imp-cancel") { state.draft = null; render(); }
  else if (act === "sample") loadSample();
  else if (act === "paste-open") { state.pasteOpen = true; render(); $("#paste-text")?.focus(); }

document.addEventListener("keydown", e => {
  const t = e.target;
  if (!t.classList?.contains("ol-input") || !state.topicEdit) return;
  const id = t.dataset.nid;
  if (e.key === "Enter") { e.preventDefault(); outlineOp("after", id); }
  else if (e.key === "Tab") { e.preventDefault(); outlineOp(e.shiftKey ? "out" : "in", id); }
  else if (e.key === "Backspace" && !t.value) { e.preventDefault(); outlineOp("del", id); }
  else if (e.altKey && e.key === "ArrowUp") { e.preventDefault(); outlineOp("up", id); }
  else if (e.altKey && e.key === "ArrowDown") { e.preventDefault(); outlineOp("down", id); }
});
document.addEventListener("keydown", e => {
  if (state.view !== "study" || !state.session) return;
  if (e.target.id === "type-input" && e.target.tagName === "TEXTAREA" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submitTyped(e.target.value); return; }
  if (e.target.matches("input,select,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const s = state.session;
  if (e.key === "Escape") { e.preventDefault(); exitStudy(); return; }
  if (s.finished) return;
  const n = ["1", "2", "3", "4"].indexOf(e.key) + 1;
  if (!s.revealed) {
    if (s.mode === "flip" && (e.key === " " || e.key === "Enter") && !e.target.closest?.("button")) { e.preventDefault(); reveal(); }
    else if (s.mode === "mc" && n) { e.preventDefault(); chooseOption(n - 1); }
    return;
  }
  if (n) { e.preventDefault(); rate(n); return; }
  if ((e.key === " " || e.key === "Enter") && !e.target.closest?.("button")) { e.preventDefault(); rate(s.answer?.suggest || 3); return; }
  if (e.key === "z" || e.key === "Z") { e.preventDefault(); undo(); }
  if ((e.key === "e" || e.key === "E") && !s.editing) { e.preventDefault(); s.editing = true; render(); focusEnd("#st-f"); }
});

  "<b>Eine Karte kommt wieder, kurz bevor du sie vergisst.</b> Sobald die geschätzte Chance, dass du die Antwort noch weißt, auf dein Ziel fällt (Standard 90 %), wird sie fällig. Leichte Karten wandern weit nach hinten, schwere kommen schnell zurück.": "<b>A card comes back just before you forget it.</b> As soon as the estimated chance that you still know the answer drops to your target (90% by default), it is due. Easy cards move far back, hard ones return quickly.",
  "<b>Was am meisten wackelt, kommt zuerst.</b> Fällige Karten sind nach dieser Chance sortiert. Neue Karten werden in kleinen Mengen eingestreut, damit sich keine Berge an Wiederholungen aufstauen.": "<b>The shakiest cards come first.</b> Due cards are sorted by that chance. New cards are mixed in a few at a time, so reviews don't pile up.",

/* ---------- Boot ---------- */
async function boot() {
  render();
  let store = null;
  try { const r = await withTimeout(fetch("/api/health"), 4000); if (r.ok) store = ApiStore(); } catch { store = null; }
  state.store = store || LocalStore();
  try { await loadAll(); }
  catch (e) {
    state.loadError = state.store.kind === "server"
      ? T("Der Karteikasten-Server antwortet nicht. Prüfe im Terminal, ob er noch läuft (npm start), und lade die Seite neu.")
      : T("Deine Stapel konnten nicht geladen werden.");
  }
  if (!state.loadError) { checkBadges({ silent: true }); await loadBackupStatus(); }
  state.loading = false; render();
}
const normDeck = m => ({ ...m, dir: m.dir || "f", mode: m.mode || "auto", newPerDay: m.newPerDay ?? 20, retention: m.retention || 0.9, newCount: m.newCount || 0, revCount: m.revCount || 0 });
const normTopics = list => {
  const out = Array.isArray(list) ? list : [];
  out.forEach((t, i) => { if (!t.outline && t.tree) { t.outline = outlineFromText(t.tree); delete t.tree; } if (t.color == null) t.color = i % COLORS; t.archived = !!t.archived; });
  return out;
};
async function loadAll() {
  // Read the revision first: anything written while loading shows up again at the next check, which is harmless.
  if (state.store.currentRev) SYNC.rev = await withTimeout(state.store.currentRev(), 10000);
  const metas = await withTimeout(state.store.listDecks(), 10000);
  const loaded = await withTimeout(Promise.all(metas.map(m => state.store.loadCards(m))), 15000);
  state.cards = {};
  metas.forEach((m, i) => { state.cards[m.id] = dedupeCards(loaded[i].map(fromRow)); });
  state.decks = metas.map(normDeck).sort((a, b) => (b.created || 0) - (a.created || 0));
  // The profile first: its settings decide which day "today" is.
  const profile = await withTimeout(state.store.getDoc("profile"), 10000);
  state.profile.prefs = normPrefs(profile?.prefs); applyPrefs();
  const today = dayKey();
  const [log, topics] = await withTimeout(Promise.all([state.store.getDoc("log-" + today), state.store.getDoc("topics")]), 10000);
  // Trees pasted before the editor existed were stored as text: normTopics turns them into an outline with ids.
  state.topics = normTopics(topics?.list);
  state.profile = { goal: profile?.goal || 20, days: { ...(profile?.days || {}) }, badges: { ...(profile?.badges || {}) }, daily: { ...(profile?.daily || {}) }, prefs: state.profile.prefs };
  state.log = { day: today, entries: Array.isArray(log?.entries) ? log.entries : [] };
  // Every earlier answer, for "Deine Entwicklung". Today's entries come from state.log so new ones land in the same list.
  state.attempts = new Map();
  const logs = state.store.listKind ? await withTimeout(state.store.listKind("log"), 10000).catch(() => []) : [];
  for (const l of logs.filter(l => l.day !== today).sort((a, b) => a.day < b.day ? -1 : 1)) for (const e of l.entries || []) addAttempt(e);
  for (const e of state.log.entries) addAttempt(e);
  // Before history existed: count today's answers from the decks.
  if (state.profile.days[today] == null) {
    const n = state.decks.reduce((a, d) => a + (d.revDay === today ? d.revCount || 0 : 0), 0);
    if (n) state.profile.days[today] = n;
  }
}
boot();
