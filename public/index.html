<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Karteikasten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
/* Layout: one calm column; only the study card gets the paper index-card treatment (red header rule, blue lines). */
:root{
  --bg:#edf0f4; --surface:#ffffff; --ink:#17212d; --muted:#5a6677; --line:#d5dbe4;
  --accent:#2347c5; --accent-ink:#ffffff;
  --card:#fffefa; --rule-red:#d4524a; --rule-blue:rgba(35,71,197,.11); --shadow:0 1px 2px rgba(20,30,50,.08),0 10px 30px rgba(20,30,50,.10);
  --again:#c4433a; --hard:#a86c12; --good:#2b844a; --easy:#2a68c9;
  --new:#2a68c9; --learn:#c4433a; --rev:#2b844a;
  --bronze:#a5652e; --silver:#6b7788; --gold:#9c7406;
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151c; --surface:#18202a; --ink:#e6ebf1; --muted:#97a2b2; --line:#2a3441;
  --accent:#86a2ff; --accent-ink:#0c1220;
  --card:#1c2531; --rule-red:#e06a61; --rule-blue:rgba(134,162,255,.09); --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --again:#ee6e64; --hard:#e2a544; --good:#55c27a; --easy:#6ea8ff;
  --new:#6ea8ff; --learn:#ee6e64; --rev:#55c27a; color-scheme:dark;
  --bronze:#d99a63; --silver:#b4bfcc; --gold:#e6bb3c;
}}
:root[data-theme="dark"]{
  --bg:#10151c; --surface:#18202a; --ink:#e6ebf1; --muted:#97a2b2; --line:#2a3441;
  --accent:#86a2ff; --accent-ink:#0c1220;
  --card:#1c2531; --rule-red:#e06a61; --rule-blue:rgba(134,162,255,.09); --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --again:#ee6e64; --hard:#e2a544; --good:#55c27a; --easy:#6ea8ff;
  --new:#6ea8ff; --learn:#ee6e64; --rev:#55c27a; color-scheme:dark;
  --bronze:#d99a63; --silver:#b4bfcc; --gold:#e6bb3c;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 72px}
#app{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:36px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(30px,5.5vw,42px);font-weight:700;letter-spacing:-.015em}
h2{font-size:21px;font-weight:700}
h3{font-size:18px;font-weight:700;overflow-wrap:anywhere}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap}
.lede{color:var(--muted);max-width:54ch;margin-top:10px}
.storage{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.dot.warn{background:var(--hard)} .dot.err{background:var(--again)}

.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:8px 16px;border:1px solid transparent;cursor:pointer;background:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:var(--line);background:var(--surface)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.ghost[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.btn.danger{color:var(--again);border-color:var(--again);background:transparent}
.btn.danger.solid{background:var(--again);color:#fff}
.btn.sm{padding:4px 12px;min-height:34px;font-size:14px}
.btn.wide{width:100%;min-height:52px;font-size:17px}
.btn[disabled]{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,.rate:focus-visible,.drop:focus-within{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
kbd{font-family:inherit;font-size:12px;font-weight:400;opacity:.75;border:1px solid currentColor;border-radius:4px;padding:0 5px;line-height:1.5}

.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:24px;background:var(--surface);display:flex;gap:16px 24px;align-items:center;justify-content:space-between;flex-wrap:wrap;transition:border-color .15s}
.drop.over{border-color:var(--accent)}
.drop .txt{min-width:0;flex:1 1 300px;display:flex;flex-direction:column;gap:4px}
.drop strong{font-family:var(--font-display);font-size:19px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

section{display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.decks{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.deck{border-bottom:1px solid var(--line);padding:18px 0;display:flex;flex-direction:column;gap:16px}
.deck-row{display:flex;justify-content:space-between;align-items:center;gap:12px 16px;flex-wrap:wrap}
.deck-main{min-width:0;flex:1 1 240px}
.counts{font-size:14px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.c-new{color:var(--new);font-weight:700}.c-learn{color:var(--learn);font-weight:700}.c-rev{color:var(--rev);font-weight:700}
.deck-actions{display:flex;gap:8px;flex-wrap:wrap}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:18px;min-width:0}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 18px}
label.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;min-width:0}
label.field .hint{font-weight:400;color:var(--muted)}
input[type=text],input[type=number],select{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
label.check{display:flex;gap:10px;align-items:center;font-size:15px}
label.check input{width:18px;height:18px;accent-color:var(--accent)}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top;max-width:280px;overflow-wrap:anywhere}
tr:last-child td{border-bottom:0}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
td.off{color:var(--muted);opacity:.6}
.error{color:var(--again);font-weight:700}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--font-display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:13px;color:var(--muted)}
.chart{display:flex;flex-direction:column;gap:6px}
.bars{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;align-items:end;height:130px;border-bottom:1px solid var(--line)}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar i{display:block;width:100%;max-width:28px;background:var(--accent);border-radius:3px 3px 0 0;min-height:1px;opacity:.85}
.bar.today i{background:var(--rev);opacity:1}
.bar-labels{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;font-size:11px;color:var(--muted);text-align:center}
.hard-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.hard-list li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.hard-list li span:first-child{min-width:0;overflow-wrap:anywhere}
.hard-list li span:last-child{color:var(--again);white-space:nowrap;font-variant-numeric:tabular-nums}

.how ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;max-width:65ch;color:var(--muted)}
.how ol b{color:var(--ink)}
.sample-table{max-width:420px}

/* Study */
.study{display:flex;flex-direction:column;gap:18px}
.study-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.study-bar .name{font-family:var(--font-display);font-weight:700;font-size:17px;min-width:0;flex:1 1 160px;overflow-wrap:anywhere}
.qcounts{display:flex;gap:14px;font-variant-numeric:tabular-nums;font-size:15px}
.qcounts span{display:flex;gap:5px;align-items:baseline}
.qcounts small{font-size:12px;color:var(--muted);font-weight:400}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s ease}
.card{position:relative;background-color:var(--card);border-radius:6px;box-shadow:var(--shadow);min-height:320px;
  padding:66px clamp(20px,5vw,52px) 36px;display:flex;flex-direction:column;gap:22px;
  background-image:linear-gradient(var(--rule-red),var(--rule-red)),repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule-blue) 31px 32px);
  background-size:100% 2px,100% calc(100% - 50px);background-position:0 46px,0 50px;background-repeat:no-repeat,no-repeat}
.card-meta{position:absolute;top:14px;left:clamp(20px,5vw,52px);right:clamp(20px,5vw,52px);display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.card-meta .tag{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11.5px;padding-top:2px}
.face{white-space:pre-wrap;overflow-wrap:anywhere;text-align:center}
.face.front{font-family:var(--font-display);font-weight:500;font-size:clamp(24px,4.6vw,34px);line-height:1.25;flex:1;display:flex;align-items:center;justify-content:center}
.face.front.sm{font-size:clamp(19px,3.4vw,24px)} .face.front.xs{font-size:17px;text-align:left}
.face.back{border-top:1px dashed var(--muted);padding-top:22px;font-size:20px;line-height:1.45}
.face.back.xs{font-size:16px;text-align:left}
.rates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.rate{--c:var(--good);display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 6px 9px;border-radius:8px;border:1px solid var(--line);border-top:4px solid var(--c);background:var(--surface);font:inherit;color:var(--ink);cursor:pointer;min-height:64px}
.rate:hover{background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.rate b{font-size:15px}
.rate span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.study-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.linkish{font:inherit;background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer}
.linkish[disabled]{opacity:.4;cursor:default;text-decoration:none}
.done{text-align:left;display:flex;flex-direction:column;gap:14px}
.done .big{font-family:var(--font-display);font-size:clamp(28px,5vw,38px);font-weight:700}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow);z-index:20}
.loading{color:var(--muted);padding:40px 0}
/* Karteikasten: compartments by how long a card is expected to stick */
.f0{background:var(--line)}
.f1{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.f2{background:color-mix(in srgb,var(--accent) 42%,var(--surface))}
.f3{background:color-mix(in srgb,var(--accent) 62%,var(--surface))}
.f4{background:color-mix(in srgb,var(--accent) 82%,var(--surface))}
.f5{background:var(--accent)}
.mastery{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-width:440px}
.segbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}
.segbar i{display:block;height:100%}
.mastery-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tier{--t:var(--muted);font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;border:1px solid var(--t);color:var(--t)}
.kasten{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:2px solid var(--muted);border-top-width:0;border-radius:0 0 10px 10px;background:var(--bg)}
.fach{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;padding:12px 4px 10px;border-left:1px solid var(--line);min-width:0;text-align:center}
.fach:first-child{border-left:0}
.stack{display:flex;flex-direction:column-reverse;gap:2px;width:72%;max-width:60px;height:76px}
.stack i{display:block;height:4px;border-radius:1px;box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 8%,transparent)}
.fach b{font-family:var(--font-display);font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.fach .nm{font-size:12px;font-weight:700}
.fach .sub{font-size:11px;color:var(--muted);line-height:1.25}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.badge{--b:var(--accent);display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;min-width:0}
.badge .disc{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:14px;border:2px dashed var(--line);color:var(--muted)}
.badge.on .disc{border:2px solid var(--b);background:color-mix(in srgb,var(--b) 16%,var(--surface));color:var(--b)}
.badge .txt{min-width:0;display:flex;flex-direction:column}
.badge .txt b{font-size:14px}
.badge .txt span{font-size:12px;color:var(--muted);line-height:1.35}
.badge:not(.on) .txt b{color:var(--muted)}
.move-note{font-variant-numeric:tabular-nums}
@media (max-width:560px){.kasten{grid-template-columns:repeat(3,minmax(0,1fr))}.fach:nth-child(4){border-left:0}.fach:nth-child(n+4){border-top:1px solid var(--line)}}
.card.tap{cursor:pointer}
.answer-form{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.answer-form input{flex:1 1 240px;font-size:18px;min-height:52px;padding:10px 14px}
.answer-form .btn{min-height:52px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:16px;line-height:1.4;color:var(--ink);cursor:pointer;min-height:56px;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt kbd{flex:none;margin-top:2px}
.opt[disabled]{cursor:default;opacity:.6}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface));opacity:1}
.opt.wrong{border-color:var(--again);background:color-mix(in srgb,var(--again) 14%,var(--surface));opacity:1}
.verdict{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border-radius:8px;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface));font-size:15px}
.verdict b{color:var(--c);font-size:16px}
.verdict q{font-weight:700;overflow-wrap:anywhere}
.rate.suggested{box-shadow:0 0 0 2px var(--c)}
.answer-form textarea{flex:1 1 100%;font:inherit;font-size:17px;line-height:1.45;min-height:96px;padding:10px 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:2px}
.chip-label{font-size:12px;color:var(--muted);min-width:64px}
.chip{font-size:13px;line-height:1.3;padding:2px 9px;border-radius:999px;border:1px solid currentColor;overflow-wrap:anywhere}
.chip.hit{color:var(--good)} .chip.miss{color:var(--again)}
mark{color:inherit;border-radius:3px;padding:0 2px}
mark.kw{background:color-mix(in srgb,var(--accent) 16%,transparent)}
mark.hit{background:color-mix(in srgb,var(--good) 24%,transparent)}
mark.miss{background:color-mix(in srgb,var(--again) 24%,transparent);text-decoration:underline wavy color-mix(in srgb,var(--again) 70%,transparent)}
.rate small{font-size:10.5px;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.07em}
@media (max-width:440px){.options{grid-template-columns:1fr}}
.drop .btns{display:flex;gap:8px;flex-wrap:wrap}
textarea{font:14px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-height:170px;resize:vertical}
textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
.today{display:flex;flex-direction:row;flex-wrap:wrap;gap:16px 28px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px}
.today .goal{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 220px}
.today .num{font-family:var(--font-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.goalbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.goalbar i{display:block;height:100%;background:var(--good);transition:width .3s ease}
.goal-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.goal-line select{width:auto;min-height:32px;padding:4px 8px;font-size:14px}
.streak{display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--muted)}
.week{display:flex;gap:6px}
.week span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.week i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:block}
.week i.on{background:var(--good);border-color:var(--good)}
.week i.now{border-color:var(--good)}
@media (max-width:440px){.rates{grid-template-columns:repeat(2,minmax(0,1fr))}.card{min-height:260px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<main id="app"><p class="loading">Lade deine Stapel …</p></main>
<div id="toast" class="toast" hidden></div>

<script src="/vendor/ts-fsrs.js"></script>
<script>
"use strict";
/* ---------- Helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const MIN = 60000, DAY = 86400000;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const dayKey = (t = Date.now()) => { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const endOfToday = () => { const d = new Date(); d.setHours(24, 0, 0, 0); return d.getTime(); };
const pct = x => Math.round(x * 100) + " %";
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: "timeout" }), ms))]);
const utf8len = s => new TextEncoder().encode(s).length;

function fmtDur(ms) {
  const m = ms / MIN;
  if (m < 60) return Math.max(1, Math.round(m)) + " Min";
  const h = m / 60;

/* ---------- Stats ---------- */
function deckStats(deck) {
  const cards = state.cards[deck.id] || [], dirs = dirsOf(deck), now = Date.now(), eod = endOfToday();
  const st = { fresh: 0, learning: 0, review: 0, mature: 0, rSum: 0, forecast: Array(14).fill(0), hard: [] };
  for (const c of cards) for (const dir of dirs) {
    const s = c["s" + dir];
    if (!s) { st.fresh++; continue; }
    if (isLearning(s)) { st.learning++; st.forecast[0]++; }
    else {
      st.review++;
      const ivl = (s.due - s.last) / DAY;
      if (ivl >= 21) st.mature++;
      st.rSum += recall(s, now);
      const idx = s.due <= eod ? 0 : Math.ceil((s.due - eod) / DAY);
      if (idx < 14) st.forecast[idx]++;
    }
    if (s.lapses >= 3) st.hard.push({ text: dir === "f" ? c.f : c.b, lapses: s.lapses });
  }
  st.hard.sort((a, b) => b.lapses - a.lapses);
  st.avgR = st.review ? st.rSum / st.review : null;
  return st;
}

  return `<span class="dot ${cls}"></span><span id="save-label">${esc(base)} · ${st}</span>`;
}

function studyHTML() {
  const s = state.session, deck = deckById(s.deckId);
  if (s.finished) return doneHTML(s, deck);
  const u = s.current, st = ust(u), now = Date.now();
  const cntNew = s.main.filter(x => !ust(x)).length + (!st ? 1 : 0);
  const cntLearn = s.learn.length + (isLearning(st) ? 1 : 0);
  const cntRev = s.main.filter(x => ust(x)?.q === 2).length + (st?.q === 2 ? 1 : 0);
  const left = s.main.length + s.learn.length + 1;
  const prog = s.done / (s.done + left);
  const front = u.dir === "f" ? u.card.f : u.card.b, back = u.dir === "f" ? u.card.b : u.card.f;
  const sizeF = front.length > 220 ? "xs" : front.length > 80 ? "sm" : "";
  const sizeB = back.length > 300 ? "xs" : "";
  let tag, info;
  if (!st) { tag = "Neu"; info = "Zum ersten Mal"; }
  else if (isLearning(st)) { tag = st.q === 3 ? "Wird neu gelernt" : "Lernphase"; info = "Zuletzt " + fmtAgo(now - st.last); }
  else { const r = recall(st, now); tag = "Wiederholung"; info = "Zuletzt " + fmtAgo(now - st.last) + " · Chance jetzt " + pct(r); }
  const tagColor = !st ? "var(--new)" : isLearning(st) ? "var(--learn)" : "var(--rev)";
  const dirNote = deck.dir === "b" ? (u.dir === "f" ? " · vorwärts" : " · rückwärts") : "";
  const flipTap = s.mode === "flip" && !s.revealed;
  const lab = [["Nochmal", "--again"], ["Schwer", "--hard"], ["Gut", "--good"], ["Leicht", "--easy"]];
  const sugg = s.answer?.suggest || 0;
  let actions = "", feedback = "";
  if (s.mode === "mc") {
    const correctN = normA(back);
    feedback = `<div class="options" role="group" aria-label="Antwort wählen">${s.options.map((o, i) => {
      const cls = s.revealed ? (normA(o) === correctN ? "right" : s.answer?.pick === i ? "wrong" : "") : "";
      return `<button class="opt ${cls}" data-act="choose" data-i="${i}" ${s.revealed ? "disabled" : ""}><kbd>${i + 1}</kbd><span>${esc(plain(o))}</span></button>`;
    }).join("")}</div>`;
    if (!s.revealed) actions = `<div class="row-actions"><button class="linkish" data-act="dont-know">Weiß ich nicht</button></div>`;
  } else if ((s.mode === "type" || s.mode === "self") && !s.revealed) {
    const long = !typeable(plain(back));
    actions = `<form class="answer-form" id="type-form" autocomplete="off">
      <label class="sr" for="type-input">Deine Antwort</label>
      ${long
        ? `<textarea id="type-input" rows="3" placeholder="Antwort in eigenen Worten …" spellcheck="false" enterkeyhint="done" data-autofocus></textarea>`
        : `<input type="text" id="type-input" placeholder="Antwort eintippen …" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" data-autofocus>`}
      <button class="btn primary" type="submit">Prüfen</button>
      <button class="linkish" type="button" data-act="dont-know">Weiß ich nicht</button>
    </form>`;
  } else if ((s.mode === "type" || s.mode === "self") && s.answer) {
    const a = s.answer, yours = a.given ? `<span>Deine Antwort: <q>${esc(a.given)}</q></span>` : "";
    if (a.method === "keywords") {
      const V = { right: ["Richtig", "--good"], close: ["Teilweise richtig", "--hard"], wrong: ["Zu wenig getroffen", "--again"], empty: ["Nicht beantwortet", "--muted"] }[a.verdict];
      const n = a.found.length + a.missing.length;
      const chips = (list, cls) => list.map(k => `<span class="chip ${cls}">${esc(k.label)}</span>`).join("");
      feedback = `<div class="verdict" style="--c:var(${V[1]})">
        <b>${V[0]} · ${a.found.length} von ${n} ${a.marked ? "markierten " : ""}Schlüsselbegriffen</b>
        ${a.found.length ? `<div class="chips"><span class="chip-label">Getroffen</span>${chips(a.found, "hit")}</div>` : ""}
        ${a.missing.length ? `<div class="chips"><span class="chip-label">Fehlt</span>${chips(a.missing, "miss")}</div>` : ""}
        ${yours}
        <span class="muted small">Geprüft wird, ob die Begriffe vorkommen, nicht der Sinn. Passt der Vorschlag nicht, bewerte selbst.</span>
      </div>`;
    } else if (a.method === "self") {
      feedback = `<div class="verdict" style="--c:var(--accent)"><b>${a.given ? "Vergleiche selbst" : "Nicht beantwortet"}</b>${yours}<span class="muted small">Die richtige Antwort steht auf der Karte. Bewerte, wie gut deine Antwort passt.</span></div>`;
    } else {
      const V = { right: ["Richtig", "--good"], close: ["Fast richtig", "--hard"], wrong: ["Nicht richtig", "--again"], empty: ["Nicht beantwortet", "--muted"] }[a.verdict];
      feedback = `<div class="verdict" style="--c:var(${V[1]})"><b>${V[0]}</b>${a.note ? `<span>${esc(a.note)}</span>` : ""}${yours}</div>`;
    }
  }
  if (s.mode === "flip" && !s.revealed) actions = `<button class="btn primary wide" data-act="reveal" data-autofocus>Antwort zeigen <kbd>Leertaste</kbd></button>`;
  if (s.revealed) {
    const pv = previewFor(s), o = pv.o;
    actions = `<div class="rates" role="group" aria-label="Wie gut wusstest du es?">${o.map((x, i) =>
      `<button class="rate ${sugg === i + 1 ? "suggested" : ""}" style="--c:var(${lab[i][1]})" data-act="rate" data-g="${i + 1}" ${(sugg ? sugg === i + 1 : i === 2) ? "data-autofocus" : ""}>${sugg === i + 1 ? "<small>Vorschlag</small>" : ""}<b>${lab[i][0]}</b><span>${fmtDur(x.due - pv.now)} · ${i + 1}</span></button>`).join("")}</div>`;
  }
  const hint = s.revealed
    ? (sugg ? "Enter übernimmt den Vorschlag. Du kannst auch selbst bewerten." : "Ehrlich bewerten: Schwer heißt gewusst, aber mit Mühe.")
    : s.mode === "mc" ? "Wähle mit 1–4 oder per Klick."
    : s.mode === "self" ? "Schreib deine Antwort auf, Enter zeigt die Lösung zum Vergleich."
    : s.mode === "type" && usesKeywords(back) ? "In eigenen Worten antworten. Geprüft wird, ob die Schlüsselbegriffe vorkommen. Enter prüft, Shift+Enter macht eine neue Zeile."
    : s.mode === "type" ? "Tippe die Antwort und drücke Enter. Kleine Tippfehler sind okay." : "Erst selbst überlegen, dann Karte antippen.";
  return `
  <div class="study">
    <div class="study-bar">
      <button class="btn ghost sm" data-act="exit">← Beenden</button>
      <div class="name">${esc(deck.name)}</div>
      <div class="qcounts" aria-label="Noch in dieser Runde">
        <span class="c-new">${cntNew}<small>neu</small></span>
        <span class="c-learn">${cntLearn}<small>lernen</small></span>
        <span class="c-rev">${cntRev}<small>fällig</small></span>
      </div>
    </div>
    <div class="progress" aria-hidden="true"><i style="width:${(prog * 100).toFixed(1)}%"></i></div>
    <article class="card ${flipTap ? "tap" : ""}" aria-live="polite" ${flipTap ? 'data-act="reveal" title="Antippen zum Aufdecken"' : ""}>
      <div class="card-meta"><span class="tag" style="color:${tagColor}">${tag}${dirNote}</span><span>${esc(info)}</span></div>
      <div class="face front ${sizeF}">${richText(front)}</div>
      ${s.revealed ? `<div class="face back ${sizeB}">${s.answer?.method === "keywords" ? highlightAnswer(back, s.answer) : richText(back)}</div>` : ""}
    </article>
    ${feedback}
    ${actions}
    <div class="study-foot">
      <span>${s.lastMove && !s.revealed ? `<span class="move-note">Letzte Karte: ${FAECHER[s.lastMove.from].name} → ${FAECHER[s.lastMove.to].name}. </span>` : ""}${hint}</span>
      <button class="linkish" data-act="undo" ${s.history.length ? "" : "disabled"}>Letzte Bewertung rückgängig (Z)</button>
    </div>
  </div>`;
}

function doneHTML(s, deck) {
  const mins = Math.max(1, Math.round((Date.now() - s.started) / MIN));
  const firsts = [...s.first.values()];
  const ok = firsts.length ? firsts.filter(g => g >= 2).length / firsts.length : 0;
  const eod = endOfToday();
  let tomorrow = 0;
  for (const c of state.cards[deck.id] || []) for (const dir of dirsOf(deck)) { const st = c["s" + dir]; if (st && (isLearning(st) || st.due <= eod + DAY)) tomorrow++; }
  const q = buildQueue(deck);
  let up = 0, down = 0;
  for (const { u, from } of s.startFach.values()) { const to = fachOf(ust(u)); if (to > from) up++; else if (to < from) down++; }
  return `
  <div class="study">
    <div class="panel done">
      <p class="eyebrow">${esc(deck.name)}</p>
      <p class="big">Für heute geschafft.</p>
      <p>${firsts.length} ${firsts.length === 1 ? "Karte" : "Karten"} in ${mins} Min. Beim ersten Versuch gewusst: <b>${pct(ok)}</b>.</p>
      ${up || down ? `<p>${up} ${up === 1 ? "Karte" : "Karten"} in ein höheres Fach gerückt${down ? `, ${down} zurückgefallen` : ""}. ${(() => { const p = deckProgress(deck); return `Fortschritt im Stapel: <b>${p.pct} %</b>${p.tier ? ` (${p.tier.name})` : ""}.`; })()}</p>` : ""}
      ${s.badges.length ? `<p>Neue Abzeichen: <b>${s.badges.map(b => esc(b.name)).join(", ")}</b>.</p>` : ""}
      <p>${(() => { const st = streakInfo(); return st.todayOk ? `Tagesziel erreicht (${st.today}/${state.profile.goal}). Serie: <b>${st.n} ${st.n === 1 ? "Tag" : "Tage"}</b>.` : `Tagesziel: ${st.today}/${state.profile.goal} Antworten. Noch ${state.profile.goal - st.today} in einem anderen Stapel, oder hol dir 10 neue Karten.`; })()}</p>
      <p class="muted">Morgen warten etwa ${tomorrow} Wiederholungen${(deck.newPerDay ?? 20) > 0 && q.unseen + q.nNew > 0 ? ` und bis zu ${deck.newPerDay ?? 20} neue Karten` : ""}. Am meisten bringt es, jeden Tag kurz zu lernen.</p>
      <div class="row-actions">
        <button class="btn primary" data-act="exit" data-autofocus>Zur Übersicht</button>
        ${q.unseen > 0 ? `<button class="btn ghost" data-act="more-new" data-id="${deck.id}">10 weitere neue Karten</button>` : ""}
      </div>
    </div>
  </div>`;
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const id = b.dataset.id, act = b.dataset.act;
  if (act === "study") startStudy(id);
  else if (act === "tab") { state.open = state.open?.id === id && state.open.tab === b.dataset.tab ? null : { id, tab: b.dataset.tab }; state.confirmDelete = null; render(); }
  else if (act === "reveal") reveal();
  else if (act === "choose") chooseOption(+b.dataset.i);
  else if (act === "dont-know") dontKnow();
  else if (act === "rate") rate(+b.dataset.g);
  else if (act === "undo") undo();
  else if (act === "exit") exitStudy();
  else if (act === "imp-go") doImport();
  else if (act === "imp-cancel") { state.draft = null; render(); }
  else if (act === "sample") loadSample();
  else if (act === "paste-open") { state.pasteOpen = true; render(); $("#paste-text")?.focus(); }
  else if (act === "paste-cancel") { state.pasteOpen = false; render(); }
  else if (act === "paste-go") { const t = $("#paste-text")?.value || ""; if (t.trim()) openImportText(t, "Eingefügter Text"); else toast("Füge zuerst Text ein."); }
  else if (act === "del") { state.confirmDelete = id; render(); }
  else if (act === "del-no") { state.confirmDelete = null; render(); }
  else if (act === "del-yes") {
    const deck = deckById(id), chunks = deck.chunks || 0;
    for (const k of [...WQ.pending.keys()]) if (k.includes(":" + id)) WQ.pending.delete(k);
    queueWrite("x:" + id, () => state.store.delDeck(id, chunks), 0);
    state.decks = state.decks.filter(d => d.id !== id); delete state.cards[id];
    state.confirmDelete = null; state.open = null; toast("Stapel gelöscht."); render();
  }
  else if (act === "more-new") {
    const deck = deckById(id); deck.newCount = (deck.newCount || 0) - 10; markMeta(deck); startStudy(id);
  }
});
document.addEventListener("change", e => {
  const t = e.target, d = state.draft;
  if (t.id === "file-new") { openImport(t.files[0]); t.value = ""; }
  else if (t.id?.startsWith("file-add-")) { openImport(t.files[0], t.dataset.id); t.value = ""; }
  else if (t.id === "imp-f" && d) { d.fc = +t.value; render(); }
  else if (t.id === "imp-b" && d) { d.bc = +t.value; render(); }
  else if (t.id === "imp-head" && d) { d.header = t.checked; render(); }
  else if (t.id === "set-name") { const deck = deckById(t.dataset.id); const v = t.value.trim(); if (v) { deck.name = v.slice(0, 120); markMeta(deck); render(); } }
  else if (t.id === "set-new") { const deck = deckById(t.dataset.id); deck.newPerDay = Math.max(0, Math.min(500, Math.round(+t.value || 0))); markMeta(deck); render(); }
  else if (t.id === "set-mode") { const deck = deckById(t.dataset.id); deck.mode = t.value; markMeta(deck); render(); }
  else if (t.id === "set-dir") { const deck = deckById(t.dataset.id); deck.dir = t.value; markMeta(deck); render(); }
  else if (t.id === "goal-sel") { state.profile.goal = Math.max(1, +t.value || 20); markProfile(); render(); }
  else if (t.id === "set-ret") { const deck = deckById(t.dataset.id); deck.retention = Math.max(0.75, Math.min(0.97, +t.value / 100)); markMeta(deck); }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "type-form") return;
  e.preventDefault(); submitTyped($("#type-input")?.value || "");
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "imp-name" && state.draft) state.draft.name = t.value;
  if (t.id === "set-ret") { const o = $("#ret-out"); if (o) o.textContent = t.value + " %"; }
});
document.addEventListener("dragover", e => { if (state.view !== "home") return; e.preventDefault(); $("#drop")?.classList.add("over"); });
document.addEventListener("dragleave", e => { if (!e.relatedTarget) $("#drop")?.classList.remove("over"); });
document.addEventListener("drop", e => {
  if (state.view !== "home") return;
  e.preventDefault(); $("#drop")?.classList.remove("over");
  const f = e.dataTransfer?.files?.[0]; if (f) openImport(f);
});
// Pasting a table anywhere on the overview opens the import preview.
document.addEventListener("paste", e => {
  if (state.view !== "home" || state.draft || state.loading) return;
  if (e.target.matches?.("input,textarea,select,[contenteditable]")) return;
  const t = e.clipboardData?.getData("text/plain") || "";
  if (!/[\t;,|]/.test(t) || !t.trim()) return;
  e.preventDefault(); openImportText(t, "Eingefügter Text");
});
document.addEventListener("keydown", e => {
  if (state.view !== "study" || !state.session) return;
  if (e.target.id === "type-input" && e.target.tagName === "TEXTAREA" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submitTyped(e.target.value); return; }
  if (e.target.matches("input,select,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const s = state.session;
  if (e.key === "Escape") { e.preventDefault(); exitStudy(); return; }
  if (s.finished) return;
  const n = ["1", "2", "3", "4"].indexOf(e.key) + 1;
  if (!s.revealed) {
    if (s.mode === "flip" && (e.key === " " || e.key === "Enter") && !e.target.closest?.("button")) { e.preventDefault(); reveal(); }
    else if (s.mode === "mc" && n) { e.preventDefault(); chooseOption(n - 1); }
    return;
  }
  if (n) { e.preventDefault(); rate(n); return; }
  if ((e.key === " " || e.key === "Enter") && !e.target.closest?.("button")) { e.preventDefault(); rate(s.answer?.suggest || 3); return; }
  if (e.key === "z" || e.key === "Z") { e.preventDefault(); undo(); }
});

/* ---------- Boot ---------- */
async function boot() {
  render();
  let store = null;
  try { const r = await withTimeout(fetch("/api/health"), 4000); if (r.ok) store = ApiStore(); } catch { store = null; }
  state.store = store || LocalStore();
  try { await loadAll(); }
  catch (e) {
    state.loadError = state.store.kind === "server"
      ? "Der Karteikasten-Server antwortet nicht. Prüfe im Terminal, ob er noch läuft (npm start), und lade die Seite neu."
      : "Deine Stapel konnten nicht geladen werden.";
  }
  if (!state.loadError) checkBadges({ silent: true });
  state.loading = false; render();
}
async function loadAll() {
  const metas = await withTimeout(state.store.listDecks(), 10000);
  const loaded = await withTimeout(Promise.all(metas.map(m => state.store.loadCards(m))), 15000);
  state.cards = {};
  metas.forEach((m, i) => { state.cards[m.id] = loaded[i].map(fromRow); });
  state.decks = metas.map(m => ({ ...m, dir: m.dir || "f", mode: m.mode || "auto", newPerDay: m.newPerDay ?? 20, retention: m.retention || 0.9, newCount: m.newCount || 0, revCount: m.revCount || 0 }))
    .sort((a, b) => (b.created || 0) - (a.created || 0));
  const today = dayKey();
  const [profile, log] = await withTimeout(Promise.all([state.store.getDoc("profile"), state.store.getDoc("log-" + today)]), 10000);
  state.profile = { goal: profile?.goal || 20, days: { ...(profile?.days || {}) }, badges: { ...(profile?.badges || {}) } };
  state.log = { day: today, entries: Array.isArray(log?.entries) ? log.entries : [] };
  // Before history existed: count today's answers from the decks.
  if (state.profile.days[today] == null) {
    const n = state.decks.reduce((a, d) => a + (d.revDay === today ? d.revCount || 0 : 0), 0);
    if (n) state.profile.days[today] = n;
  }
}
boot();
</script>
</body>
</html>
